name: Build vive.exe

on:
  push:

permissions:
  contents: write

concurrency:
  group: vive-${{ github.ref_type == 'tag' && format('tag-{0}', github.ref_name) || 'latest' }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish vive.exe
    # The preview publisher creates the tag "latest". Do not turn that event into a stable release.
    if: ${{ !(github.ref_type == 'tag' && github.ref_name == 'latest' && github.actor == 'github-actions[bot]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Apply single-file patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Checkout on Windows rewrites the patch to CRLF, and git apply then rejects it.
          $text = [System.IO.File]::ReadAllText("${{ github.workspace }}/vive.patch")
          $text = $text -replace "`r`n", "`n" -replace "`r", "`n"
          $normalized = Join-Path $env:RUNNER_TEMP "vive.lf.patch"
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($normalized, $text, $utf8)
          git -C src apply --whitespace=nowarn $normalized
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: dotnet build src/ViVeTool/ViVeTool.csproj -c Release --nologo

      - name: Check single-file output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "src/ViVeTool/bin/Release"
          $exePath = Join-Path $outDir "vive.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "vive.exe was not produced."
          }
          $files = @(Get-ChildItem -LiteralPath $outDir -Force -Recurse -File)
          $extras = @($files | Where-Object { $_.FullName -ne (Resolve-Path -LiteralPath $exePath).Path })
          if ($extras.Count -gt 0) {
            throw "Expected only vive.exe, found: $($extras.Name -join ', ')"
          }
          $assembly = [System.Reflection.Assembly]::Load([System.IO.File]::ReadAllBytes($exePath))
          $names = @($assembly.GetManifestResourceNames())
          foreach ($required in @(
              "FeatureDictionary.pfs",
              "costura.albacore.vive.dll.compressed",
              "costura.newtonsoft.json.dll.compressed")) {
            if ($names -notcontains $required) {
              throw "vive.exe is missing embedded resource $required"
            }
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE "dist") | Out-Null
          Copy-Item -LiteralPath $exePath -Destination (Join-Path $env:GITHUB_WORKSPACE "dist/vive.exe")

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist/vive.exe"
          $upstream = (git -C src rev-parse HEAD).Trim()
          $isTag = "${{ github.ref_type }}" -eq "tag"
          if ($isTag) {
            $version = "${{ github.ref_name }}"
            $lines = @(
              "Official single-file build ($version).",
              "",
              "Upstream: https://github.com/thebookisclosed/ViVe/commit/$upstream",
              "Source commit: ${{ github.sha }}"
            )
          } else {
            $version = "latest"
            $lines = @(
              "Preview single-file build.",
              "",
              "Upstream: https://github.com/thebookisclosed/ViVe/commit/$upstream",
              "Source commit: ${{ github.sha }}"
            )
          }
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.txt"
          Set-Content -LiteralPath $notesFile -Value $lines -Encoding utf8NoBOM
          if ($isTag) {
            # Drop a previous release for this tag. Keep the tag that triggered this run.
            gh release delete "$version" --yes 2>$null
            gh release create "$version" "$exe" --title "$version" --target "${{ github.sha }}" --notes-file "$notesFile"
          } else {
            # Replace the moving preview release. Its tag name is the version: latest.
            gh release delete "latest" --yes --cleanup-tag 2>$null
            gh release create "latest" "$exe" --prerelease --target "${{ github.sha }}" --title "latest" --notes-file "$notesFile"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
